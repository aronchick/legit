model:
  provider: claude
  temperature: 0.3

github:
  token_env: GITHUB_TOKEN

profiles:
  - name: wdbaruni
    sources:
      - type: primary
        repo: bacalhau-project/bacalhau
        username: wdbaruni
    chunk_size: 20

  - name: thockin
    sources:
      - type: primary
        repo: kubernetes/kubernetes
        username: thockin
    chunk_size: 20
    map_concurrency: 4

  - name: liggitt
    sources:
      - type: primary
        repo: kubernetes/kubernetes
        username: liggitt
    chunk_size: 20
    map_concurrency: 4

  - name: bgrant0607
    sources:
      - type: primary
        repo: kubernetes/kubernetes
        username: bgrant0607
    chunk_size: 20
    map_concurrency: 4

  - name: lavalamp
    sources:
      - type: primary
        repo: kubernetes/kubernetes
        username: lavalamp
    chunk_size: 20
    map_concurrency: 4

retrieval:
  top_k: 10

review:
  post_to_github: false
  abstention_threshold: 0.5

calibration:
  # Train/eval boundary: builds only use activity before this date; calibrate
  # only evaluates PRs created+merged on/after it. Pre-existing embeddings
  # and expertise indexes were fetched 2026-03-25..28, so they sit safely
  # inside the training window.
  holdout_after: "2026-04-01"
  holdout_count: 10
